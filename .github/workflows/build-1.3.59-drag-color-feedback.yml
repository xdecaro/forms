name: Build Forms 1.3.59 Drag Color Feedback
on:
  push:
    paths:
      - 'tools/build-1.3.59-drag-color-feedback.sh'
      - '.github/workflows/build-1.3.59-drag-color-feedback.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Forms 1.3.59
        run: bash tools/build-1.3.59-drag-color-feedback.sh
      - name: Commit release and cleanup helpers
        run: |
          rm -f tools/build-1.3.59-drag-color-feedback.sh
          rm -f .github/workflows/build-1.3.59-drag-color-feedback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Forms 1.3.59 drag color feedback" || exit 0
          git push
