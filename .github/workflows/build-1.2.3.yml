name: Build Forms 1.2.3

on:
  push:
    paths:
      - 'tools/build-1.2.3/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate Joomla package
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/forms123
          rm -rf "$ROOT"
          mkdir -p "$ROOT/outer" "$ROOT/component" "$ROOT/plugin"

          unzip -q releases/1.2.2/pkg_decaroforms_1.2.2.zip -d "$ROOT/outer"
          unzip -q "$ROOT/outer/com_decaroforms_1.2.2.zip" -d "$ROOT/component"
          unzip -q "$ROOT/outer/plg_system_decaroforms_1.2.2.zip" -d "$ROOT/plugin"

          python3 patches/1.2.3/apply_patch.py "$ROOT/component" "$ROOT/plugin" "$ROOT/outer"

          echo '=== PHP syntax check ==='
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null
          done < <(find "$ROOT/component" "$ROOT/plugin" -type f -name '*.php' -print0)

          echo '=== XML syntax check ==='
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for f in [
              Path('/tmp/forms123/component/com_decaroforms.xml'),
              Path('/tmp/forms123/plugin/decaroforms.xml'),
              Path('/tmp/forms123/outer/pkg_decaroforms.xml'),
          ]:
              ET.parse(f)
              print('OK', f)
          PY

          echo '=== Feature checks ==='
          grep -q "'color'=>'#0d6efd'" "$ROOT/component/administrator/components/com_decaroforms/src/Helper/FormHelper.php"
          grep -q 'statusBadgeStyle' "$ROOT/component/administrator/components/com_decaroforms/src/Helper/FormHelper.php"
          grep -q 'data-status-color' "$ROOT/component/administrator/components/com_decaroforms/tmpl/builder/default.php"
          grep -q 'df-column-list{display:flex' "$ROOT/component/administrator/components/com_decaroforms/tmpl/builder/default.php"
          grep -q 'df-sub-stats' "$ROOT/component/administrator/components/com_decaroforms/tmpl/submissions/default.php"
          grep -q 'df-filter-panel' "$ROOT/component/administrator/components/com_decaroforms/tmpl/submissions/default.php"
          grep -q 'df-columns-toggle' "$ROOT/component/administrator/components/com_decaroforms/tmpl/recent/default.php"
          grep -q 'decaroforms.recent.columns.v1' "$ROOT/component/administrator/components/com_decaroforms/tmpl/recent/default.php"
          grep -q 'df-status-preview' "$ROOT/component/administrator/components/com_decaroforms/tmpl/submission/default.php"
          grep -q "VERSION = '1.2.3'" "$ROOT/component/administrator/components/com_decaroforms/src/Helper/FormHelper.php"

          rm -f "$ROOT/outer/com_decaroforms_1.2.2.zip" "$ROOT/outer/plg_system_decaroforms_1.2.2.zip"
          (cd "$ROOT/component" && zip -qr "$ROOT/outer/com_decaroforms_1.2.3.zip" .)
          (cd "$ROOT/plugin" && zip -qr "$ROOT/outer/plg_system_decaroforms_1.2.3.zip" .)

          grep -q 'com_decaroforms_1.2.3.zip' "$ROOT/outer/pkg_decaroforms.xml"
          grep -q 'plg_system_decaroforms_1.2.3.zip' "$ROOT/outer/pkg_decaroforms.xml"
          grep -q '<version>1.2.3</version>' "$ROOT/component/com_decaroforms.xml"
          grep -q '<version>1.2.3</version>' "$ROOT/plugin/decaroforms.xml"
          grep -q '<version>1.2.3</version>' "$ROOT/outer/pkg_decaroforms.xml"

          mkdir -p releases/1.2.3
          rm -f releases/1.2.3/pkg_decaroforms_1.2.3.zip
          (cd "$ROOT/outer" && zip -qr "$GITHUB_WORKSPACE/releases/1.2.3/pkg_decaroforms_1.2.3.zip" .)

          unzip -t releases/1.2.3/pkg_decaroforms_1.2.3.zip >/dev/null
          unzip -t "$ROOT/outer/com_decaroforms_1.2.3.zip" >/dev/null
          unzip -t "$ROOT/outer/plg_system_decaroforms_1.2.3.zip" >/dev/null

          SHA=$(sha256sum releases/1.2.3/pkg_decaroforms_1.2.3.zip | awk '{print $1}')
          echo "PACKAGE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Built SHA-256: $SHA"

      - name: Write release metadata and update feed
        shell: bash
        run: |
          set -euo pipefail
          cat > releases/1.2.3/README.md <<EOF
          # Forms 1.2.3

          Administrator workflow and status-color release.

          ## Added

          - configurable **badge color** for every status of each form;
          - sensible default colors: blue for New, amber for Processing, green for Replied, grey for Closed and red for Spam;
          - status colors are reused consistently in submission lists, recent submissions and the single-submission status preview;
          - per-form submissions page now includes summary cards, full filters, rows selector and an explicit Back button;
          - **Columns** menu in Recent submissions to show or hide Form, Reference, Email, Status and Date;
          - Recent-submissions column preferences are remembered in the current browser.

          ## Changed

          - **Colonne della tabella** in form settings is now a single vertical list with one boxed row per column;
          - custom status configuration now stores label, technical key and badge color in the existing status JSON configuration;
          - no database schema change is required.

          ## Compatibility

          - Joomla 6.0+
          - PHP 8.3+
          - existing forms and submissions are preserved;
          - forms created before 1.2.3 automatically receive suitable default badge colors.

          Official package SHA-256:

          \`${PACKAGE_SHA}\`
          EOF

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          sha = os.environ['PACKAGE_SHA']
          update = f'''<?xml version="1.0" encoding="utf-8"?>
          <updates>
              <update>
                  <name>Forms</name>
                  <description>Reusable Joomla form builder, submissions manager, data importer and export tools.</description>
                  <element>pkg_decaroforms</element>
                  <type>package</type>
                  <client>site</client>
                  <version>1.2.3</version>
                  <downloads>
                      <downloadurl type="full" format="zip">https://raw.githubusercontent.com/xdecaro/forms/main/releases/1.2.3/pkg_decaroforms_1.2.3.zip</downloadurl>
                  </downloads>
                  <changelogurl>https://raw.githubusercontent.com/xdecaro/forms/main/updates/changelog.xml</changelogurl>
                  <tags>
                      <tag>stable</tag>
                  </tags>
                  <maintainer>Luca De Caro</maintainer>
                  <maintainerurl>https://github.com/xdecaro/forms</maintainerurl>
                  <targetplatform name="joomla" version="6\\.[0-9]+" />
                  <php_minimum>8.3.0</php_minimum>
                  <sha256>{sha}</sha256>
              </update>
          </updates>
          '''
          Path('updates/pkg_decaroforms.xml').write_text(update, encoding='utf-8')

          path = Path('updates/changelog.xml')
          text = path.read_text(encoding='utf-8')
          if '<version>1.2.3</version>' not in text:
              entry = '''  <changelog>
              <element>pkg_decaroforms</element>
              <type>package</type>
              <version>1.2.3</version>
              <addition>
                <item>Configurable per-status badge colors with sensible defaults.</item>
                <item>Summary cards, full filters and Back navigation on each form submissions page.</item>
                <item>Recent submissions table column selector with remembered browser preference.</item>
              </addition>
              <change>
                <item>Table-column settings are displayed as one boxed row per column.</item>
                <item>Status colors are shown consistently in lists and submission detail.</item>
              </change>
            </changelog>
          '''
              text = text.replace('<changelogs>\n', '<changelogs>\n' + entry, 1)
              path.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          r = re.sub(r'(## Current development version\s+\n\n)\*\*[^*]+\*\*', r'\g<1>**1.2.3**', r, count=1)
          if 'configurable badge colors for each form status' not in r:
              r = r.replace('- submissions management with a custom status workflow for each form;\n', '- submissions management with a custom status workflow for each form;\n- configurable badge colors for each form status;\n', 1)
          readme.write_text(r, encoding='utf-8')
          PY

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('updates/pkg_decaroforms.xml')
          ET.parse('updates/changelog.xml')
          print('Update XML valid')
          PY

      - name: Clean temporary helpers and publish 1.2.3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/inspect-1.2.2 tools/build-1.2.3 patches/1.2.3
          rm -f .github/workflows/inspect-1.2.2.yml .github/workflows/build-1.2.3.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Release Forms 1.2.3'
          git push origin HEAD:main
