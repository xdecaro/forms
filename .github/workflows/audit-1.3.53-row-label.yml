name: Audit Forms 1.3.53 Row Label

on:
  push:
    paths:
      - 'tools/audit-1.3.53-row-label.sh'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit row label logic
        run: bash tools/audit-1.3.53-row-label.sh
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/audit-1.3.53-row-label-report.txt
          git commit -m "Audit Forms 1.3.53 Row label logic"
          git pull --rebase origin main
          git push
