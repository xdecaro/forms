name: Inspect Forms 1.3.46 plugin render

on:
  push:
    paths:
      - 'releases/_inspect1346plugin/READY'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect plugin render
        run: bash tools/inspect-1.3.46-plugin-render.sh
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf releases/_inspect1346plugin
          git add -A
          git commit -m "Inspect Forms 1.3.46 plugin render" || exit 0
          git push
