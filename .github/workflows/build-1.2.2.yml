name: Build Forms 1.2.2

on:
  push:
    paths:
      - 'tools/build-1.2.2/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate Joomla package
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/forms122
          rm -rf "$ROOT"
          mkdir -p "$ROOT/outer" "$ROOT/component" "$ROOT/plugin"

          unzip -q releases/1.2.1/pkg_decaroforms_1.2.1.zip -d "$ROOT/outer"
          unzip -q "$ROOT/outer/com_decaroforms_1.2.1.zip" -d "$ROOT/component"
          unzip -q "$ROOT/outer/plg_system_decaroforms_1.2.1.zip" -d "$ROOT/plugin"

          python3 patches/1.2.2/apply_patch.py "$ROOT/component" "$ROOT/plugin" "$ROOT/outer"

          echo '=== PHP syntax check ==='
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find "$ROOT/component" "$ROOT/plugin" -type f -name '*.php' -print0)

          echo '=== XML syntax check ==='
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for f in [
              Path('/tmp/forms122/component/com_decaroforms.xml'),
              Path('/tmp/forms122/plugin/decaroforms.xml'),
              Path('/tmp/forms122/outer/pkg_decaroforms.xml'),
          ]:
              ET.parse(f)
              print('OK', f)
          PY

          rm -f "$ROOT/outer/com_decaroforms_1.2.1.zip" "$ROOT/outer/plg_system_decaroforms_1.2.1.zip"
          (cd "$ROOT/component" && zip -qr "$ROOT/outer/com_decaroforms_1.2.2.zip" .)
          (cd "$ROOT/plugin" && zip -qr "$ROOT/outer/plg_system_decaroforms_1.2.2.zip" .)

          grep -q 'com_decaroforms_1.2.2.zip' "$ROOT/outer/pkg_decaroforms.xml"
          grep -q 'plg_system_decaroforms_1.2.2.zip' "$ROOT/outer/pkg_decaroforms.xml"
          grep -q '<version>1.2.2</version>' "$ROOT/component/com_decaroforms.xml"
          grep -q '<version>1.2.2</version>' "$ROOT/plugin/decaroforms.xml"
          grep -q '<version>1.2.2</version>' "$ROOT/outer/pkg_decaroforms.xml"
          grep -q "VERSION = '1.2.2'" "$ROOT/component/administrator/components/com_decaroforms/src/Helper/FormHelper.php"

          mkdir -p releases/1.2.2
          rm -f releases/1.2.2/pkg_decaroforms_1.2.2.zip
          (cd "$ROOT/outer" && zip -qr "$GITHUB_WORKSPACE/releases/1.2.2/pkg_decaroforms_1.2.2.zip" .)

          unzip -t releases/1.2.2/pkg_decaroforms_1.2.2.zip >/dev/null
          unzip -t "$ROOT/outer/com_decaroforms_1.2.2.zip" >/dev/null
          unzip -t "$ROOT/outer/plg_system_decaroforms_1.2.2.zip" >/dev/null

          SHA=$(sha256sum releases/1.2.2/pkg_decaroforms_1.2.2.zip | awk '{print $1}')
          echo "PACKAGE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Built SHA-256: $SHA"

      - name: Write release metadata and update feed
        shell: bash
        run: |
          set -euo pipefail
          cat > releases/1.2.2/README.md <<EOF
          # Forms 1.2.2

          Usability and submissions-management release for the Joomla administrator UI.

          ## Added

          - redesigned **Invii recenti** page with summary cards, form/status filters, search and rows selector;
          - selectable submission rows with **Seleziona tutti / Deseleziona tutti**;
          - single **Esporta** menu for CSV, Excel and PDF, exporting only the selected submissions;
          - redesigned single-submission view with data on the left and **Gestisci invio** on the right;
          - clickable email template cards with a modal facsimile preview using sample values only for fields present in the current form;
          - administrator/user preview tabs and **Usa questo template** action.

          ## Changed

          - simpler Italian administrator terminology: **Riepilogo**, **Importa dati**, **Guida**, **Nuovo modulo**, **Modifica modulo**, **Vedi invii**, **Elenco moduli**;
          - per-form table setting is named **Colonne della tabella**;
          - submission management uses **Salva e chiudi**, returning to the form's submissions list;
          - existing per-form custom statuses and configurable data columns remain supported.

          ## Compatibility

          - Joomla 6.0+
          - PHP 8.3+
          - no destructive database changes;
          - existing forms and submissions are preserved.

          Official package SHA-256:

          \`${PACKAGE_SHA}\`
          EOF

          python3 - <<'PY'
          import os
          from pathlib import Path

          sha = os.environ['PACKAGE_SHA']
          update = f'''<?xml version="1.0" encoding="utf-8"?>
          <updates>
              <update>
                  <name>Forms</name>
                  <description>Reusable Joomla form builder, submissions manager, data importer and export tools.</description>
                  <element>pkg_decaroforms</element>
                  <type>package</type>
                  <client>site</client>
                  <version>1.2.2</version>
                  <downloads>
                      <downloadurl type="full" format="zip">https://raw.githubusercontent.com/xdecaro/forms/main/releases/1.2.2/pkg_decaroforms_1.2.2.zip</downloadurl>
                  </downloads>
                  <changelogurl>https://raw.githubusercontent.com/xdecaro/forms/main/updates/changelog.xml</changelogurl>
                  <tags>
                      <tag>stable</tag>
                  </tags>
                  <maintainer>Luca De Caro</maintainer>
                  <maintainerurl>https://github.com/xdecaro/forms</maintainerurl>
                  <targetplatform name="joomla" version="6\\.[0-9]+" />
                  <php_minimum>8.3.0</php_minimum>
                  <sha256>{sha}</sha256>
              </update>
          </updates>
          '''
          Path('updates/pkg_decaroforms.xml').write_text(update, encoding='utf-8')

          path = Path('updates/changelog.xml')
          text = path.read_text(encoding='utf-8')
          if '<version>1.2.2</version>' not in text:
              entry = '''  <changelog>
              <element>pkg_decaroforms</element>
              <type>package</type>
              <version>1.2.2</version>
              <addition>
                <item>Recent submissions dashboard with summary cards and combined filters.</item>
                <item>Submission row selection and selected-only CSV, Excel and PDF export.</item>
                <item>Two-column submission detail with management panel and internal note.</item>
                <item>Email template modal preview built from the current form fields.</item>
              </addition>
              <change>
                <item>Simplified administrator terminology in Italian.</item>
                <item>Table column configuration is presented as Colonne della tabella.</item>
                <item>Saving a submission now closes the detail and returns to the submissions list.</item>
              </change>
            </changelog>
          '''
              text = text.replace('<changelogs>\n', '<changelogs>\n' + entry, 1)
              path.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('updates/pkg_decaroforms.xml')
          ET.parse('updates/changelog.xml')
          print('Update XML valid')
          PY

      - name: Clean temporary build helpers and publish 1.2.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/inspect tools/build-1.2.2 patches/1.2.2
          rm -f .github/workflows/inspect-package.yml .github/workflows/inspect-files.yml .github/workflows/build-1.2.2.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Release Forms 1.2.2'
          git push origin HEAD:main
