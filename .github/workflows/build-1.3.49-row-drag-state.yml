name: Build Forms 1.3.49 row drag state

on:
  push:
    paths:
      - 'releases/_build1349/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Forms 1.3.49
        run: bash tools/build-1.3.49-row-drag-state.sh
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf releases/_build1349
          git add -A
          git commit -m "Release Forms 1.3.49" || exit 0
          git push
