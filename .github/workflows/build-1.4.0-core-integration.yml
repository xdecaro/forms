name: Build Forms 1.4.0 Core integration

on:
  push:
    branches: [main]
    paths:
      - "tools/build-1.4.0-core-integration.sh"
      - ".github/workflows/build-1.4.0-core-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize Core integration guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/build-1.4.0-core-integration.sh')
          s = p.read_text(encoding='utf-8')
          lines = []
          for line in s.splitlines():
              if line.startswith('grep -Fq "class_exists(') or line.startswith('grep -q "class_exists('):
                  lines.append('grep -q "class_exists" "$MODEL"')
              elif line.startswith('grep ') and 'Version::VERSION' in line:
                  lines.append('grep -Fq "Version::VERSION" "$MODEL"')
              elif line == "grep -q 'COM_DECAROFORMS_INFO_CORE_API' \"$TPL\"":
                  lines.append("grep -q 'COM_DECAROFORMS_INFO_CORE_API' \"$MODEL\"")
                  lines.append("grep -Fq '$metricLabelKey' \"$TPL\"")
              else:
                  lines.append(line)
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Build and validate Forms 1.4.0
        shell: bash
        run: bash tools/build-1.4.0-core-integration.sh

      - name: Commit generated release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build-1.4.0-core-integration.sh releases/1.4.0 updates/pkg_decaroforms.xml updates/changelog.xml README.md
          if git diff --cached --quiet; then
            echo "Forms 1.4.0 already generated."
            exit 0
          fi
          git commit -m "Publish Forms 1.4.0 Core integration"
          git pull --rebase origin main
          git push origin HEAD:main
