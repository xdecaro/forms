name: Build Forms 1.3.48 row drag metadata

on:
  push:
    paths:
      - 'releases/_build1348/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Forms 1.3.48
        run: bash tools/build-1.3.48-row-drag-metadata.sh
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf releases/_build1348
          git add -A
          git commit -m "Release Forms 1.3.48" || exit 0
          git push
