name: Audit Forms 1.3.49 Row Model

on:
  push:
    paths:
      - 'releases/_audit1349row/READY'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit row model
        run: bash tools/audit-1.3.49-row-model.sh
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf releases/_audit1349row
          git add tools/audit-1.3.49-row-model-report.txt
          git add -u releases/_audit1349row || true
          git commit -m "Audit Forms 1.3.49 row model" || exit 0
          git push
