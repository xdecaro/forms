name: Build Forms 1.3.46 accordion delete UI

on:
  push:
    paths:
      - 'releases/_build1346/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Forms 1.3.46
        run: bash tools/build-1.3.46-accordion-delete-ui.sh
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf releases/_build1346
          git add -A
          git commit -m "Publish Forms 1.3.46 accordion delete UI" || exit 0
          git push
