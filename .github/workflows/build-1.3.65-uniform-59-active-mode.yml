name: Build Forms 1.3.65 Uniform 59 Active Mode
on:
  push:
    paths:
      - 'tools/build-1.3.65-uniform-59-active-mode.sh'
      - '.github/workflows/build-1.3.65-uniform-59-active-mode.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Forms 1.3.65
        run: bash tools/build-1.3.65-uniform-59-active-mode.sh
      - name: Commit release and cleanup helpers
        run: |
          rm -f tools/build-1.3.65-uniform-59-active-mode.sh
          rm -f .github/workflows/build-1.3.65-uniform-59-active-mode.yml
          rm -f tools/inspect-1.3.64-active-toggle.sh
          rm -f tools/inspect-1.3.64-active-toggle-report.txt
          rm -f .github/workflows/inspect-1.3.64-active-toggle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Forms 1.3.65 uniform 59px active mode" || exit 0
          git push
