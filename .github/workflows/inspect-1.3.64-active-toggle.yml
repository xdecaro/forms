name: Inspect Forms 1.3.64 Active Toggle
on:
  push:
    paths:
      - 'tools/inspect-1.3.64-active-toggle.sh'
      - '.github/workflows/inspect-1.3.64-active-toggle.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect
        run: bash tools/inspect-1.3.64-active-toggle.sh
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/inspect-1.3.64-active-toggle-report.txt
          git commit -m "Inspect Forms 1.3.64 active toggle" || exit 0
          git push
