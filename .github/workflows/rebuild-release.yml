name: Rebuild release package

on:
  push:
    paths:
      - 'releases/_upload/READY'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forms release operation
        shell: bash
        run: |
          set -euo pipefail
          MODE="$(cat releases/_upload/MODE.txt 2>/dev/null || true)"
          if [ "$MODE" = "inspect-1.2.7" ]; then
            ROOT=/tmp/forms127
            rm -rf "$ROOT" && mkdir -p "$ROOT/outer" "$ROOT/component"
            unzip -q releases/1.2.7/pkg_decaroforms_1.2.7.zip -d "$ROOT/outer"
            unzip -q "$ROOT/outer/com_decaroforms_1.2.7.zip" -d "$ROOT/component"
            for f in \
              administrator/components/com_decaroforms/tmpl/forms/default.php \
              administrator/components/com_decaroforms/tmpl/submissions/default.php \
              administrator/components/com_decaroforms/src/Controller/BuilderController.php \
              administrator/components/com_decaroforms/language/it-IT/com_decaroforms.ini \
              com_decaroforms.xml; do
              echo "===== $f ====="
              cat "$ROOT/component/$f"
            done
            exit 0
          fi
          VERSION="$(cat releases/_upload/VERSION.txt)"
          EXPECTED="$(cat releases/_upload/SHA256.txt)"
          TARGET="releases/${VERSION}/pkg_decaroforms_${VERSION}.zip"
          mkdir -p "releases/${VERSION}"
          cat releases/_upload/part-000.b64 releases/_upload/part-001.b64 releases/_upload/part-002.b64 releases/_upload/part-003.b64 releases/_upload/part-004.b64 releases/_upload/part-005.b64 releases/_upload/part-006.b64 releases/_upload/part-007.b64 releases/_upload/part-008.b64 | base64 -d | xz -d > "$TARGET"
          ACTUAL="$(sha256sum "$TARGET" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf releases/_upload
      - name: Commit rebuilt package
        shell: bash
        run: |
          MODE="$(cat releases/_upload/MODE.txt 2>/dev/null || true)"
          if [ "$MODE" = "inspect-1.2.7" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases
          git commit -m "Publish Forms release package" || exit 0
          git push
