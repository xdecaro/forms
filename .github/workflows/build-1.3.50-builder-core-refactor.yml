name: Build Forms 1.3.50 Builder Core Refactor

on:
  push:
    paths:
      - 'releases/_build1350/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Forms 1.3.50
        run: bash tools/build-1.3.50-builder-core-refactor-v2.sh
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/1.3.50 updates/pkg_decaroforms.xml updates/changelog.xml
          git commit -m "Release Forms 1.3.50 Builder core refactor"
          git pull --rebase origin main
          git push
