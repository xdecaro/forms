name: Extract Forms 1.3.49 BuilderController
on:
  push:
    paths:
      - 'releases/_extract1349controller/READY'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/extract-1.3.49-builder-controller.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf releases/_extract1349controller
          git add tools/audit-1.3.49-builder-controller-save.txt
          git add -u releases/_extract1349controller || true
          git commit -m "Inspect Forms 1.3.49 BuilderController save" || exit 0
          git push
