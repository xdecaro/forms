name: Inspect Forms 1.3.69 information view

on:
  push:
    paths:
      - 'tools/inspect-1.3.69-information.sh'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current Information view
        shell: bash
        run: bash tools/inspect-1.3.69-information.sh
      - name: Commit inspection report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/_inspect-1.3.69-information.txt
          git commit -m "Inspect Forms 1.3.69 information view" || exit 0
          git push
