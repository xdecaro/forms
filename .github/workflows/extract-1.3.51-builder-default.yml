name: Extract Forms 1.3.51 Builder Default

on:
  push:
    paths:
      - 'releases/_extract1351/READY'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Builder default.php
        run: bash tools/extract-1.3.51-builder-default.sh
      - name: Commit extracted Builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/extracted-1.3.51-builder-default.php.txt
          git commit -m "Extract Forms 1.3.51 Builder default"
          git pull --rebase origin main
          git push
