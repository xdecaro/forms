name: Build Forms 1.5.0 Core UI

on:
  push:
    branches: [main]
    paths:
      - "tools/build-1.5.0-core-ui.sh"
      - ".github/workflows/build-1.5.0-core-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate build script
        shell: bash
        run: bash -n tools/build-1.5.0-core-ui.sh

      - name: Build and validate Forms 1.5.0
        shell: bash
        run: bash tools/build-1.5.0-core-ui.sh

      - name: Verify generated Core integration
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.5.0"
          COMPONENT="releases/${VERSION}/com_decaroforms_${VERSION}.zip"
          PACKAGE="releases/${VERSION}/pkg_decaroforms_${VERSION}.zip"

          unzip -t "$PACKAGE" >/dev/null
          unzip -l "$COMPONENT" | grep -Fq 'administrator/components/com_decaroforms/tmpl/information/core.php'
          unzip -l "$COMPONENT" | grep -Fq 'media/css/core-bridge.css'
          unzip -p "$COMPONENT" administrator/components/com_decaroforms/src/View/Information/HtmlView.php | grep -Fq "MINIMUM_CORE_UI_VERSION = '1.1.0'"
          unzip -p "$COMPONENT" administrator/components/com_decaroforms/src/View/Information/HtmlView.php | grep -Fq 'Xdecaro\Core\Asset\AssetService'
          unzip -p "$COMPONENT" administrator/components/com_decaroforms/src/View/Information/HtmlView.php | grep -Fq 'useComponents($wa)'
          unzip -p "$COMPONENT" administrator/components/com_decaroforms/src/View/Information/HtmlView.php | grep -Fq "setLayout('core')"
          unzip -p "$COMPONENT" administrator/components/com_decaroforms/tmpl/information/core.php | grep -Fq 'dfi-page xdecaro-scope forms-core-scope'
          unzip -p "$COMPONENT" media/css/core-bridge.css | grep -Fq -- '--xdecaro-color-text'

          if unzip -p "$COMPONENT" media/css/core-bridge.css | grep -Fq '!important'; then
            echo 'Core bridge must not use !important' >&2
            exit 1
          fi

          grep -Fq '<version>1.5.0</version>' releases/${VERSION}/pkg_decaroforms.xml
          grep -Fq '<name>Forms by xdecaro</name>' updates/pkg_decaroforms.xml
          grep -Fq '<version>1.5.0</version>' updates/pkg_decaroforms.xml
          grep -Fq 'releases/1.5.0/pkg_decaroforms_1.5.0.zip' updates/pkg_decaroforms.xml

      - name: Commit generated release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/1.5.0 updates/pkg_decaroforms.xml updates/changelog.xml README.md
          if git diff --cached --quiet; then
            echo "Forms 1.5.0 already generated."
            exit 0
          fi
          git commit -m "Publish Forms 1.5.0 Core UI integration"
          git pull --rebase origin main
          git push origin HEAD:main
