name: Build Forms 1.3.58 Fluid Magnetic Field Drag
on:
  push:
    paths:
      - 'tools/build-1.3.58-fluid-magnetic-field-drag.sh'
      - '.github/workflows/build-1.3.58-fluid-magnetic-field-drag.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Forms 1.3.58
        run: bash tools/build-1.3.58-fluid-magnetic-field-drag.sh
      - name: Commit release and cleanup helpers
        run: |
          rm -f tools/build-1.3.58-fluid-magnetic-field-drag.sh
          rm -f .github/workflows/build-1.3.58-fluid-magnetic-field-drag.yml
          rm -f tools/inspect-1.3.57-field-drag.sh
          rm -f tools/inspect-1.3.57-field-drag-report.txt
          rm -f .github/workflows/inspect-1.3.57-field-drag.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Forms 1.3.58 fluid magnetic field drag" || exit 0
          git push
