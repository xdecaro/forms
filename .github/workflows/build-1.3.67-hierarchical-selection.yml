name: Build Forms 1.3.67 Hierarchical Selection
on:
  push:
    paths:
      - 'tools/build-1.3.67-hierarchical-selection.sh'
      - '.github/workflows/build-1.3.67-hierarchical-selection.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Forms 1.3.67
        run: bash tools/build-1.3.67-hierarchical-selection.sh
      - name: Commit release and cleanup helpers
        run: |
          rm -f tools/build-1.3.67-hierarchical-selection.sh
          rm -f .github/workflows/build-1.3.67-hierarchical-selection.yml
          rm -f tools/inspect-1.3.66-selection-context.sh
          rm -f tools/inspect-1.3.66-selection-context-report.txt
          rm -f .github/workflows/inspect-1.3.66-selection-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Forms 1.3.67 hierarchical active selection" || exit 0
          git push
