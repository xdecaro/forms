name: Build Forms 1.3.66 Builder UI Cleanup
on:
  push:
    paths:
      - 'tools/build-1.3.66-builder-ui-cleanup.sh'
      - '.github/workflows/build-1.3.66-builder-ui-cleanup.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Forms 1.3.66
        run: bash tools/build-1.3.66-builder-ui-cleanup.sh
      - name: Commit release and cleanup helpers
        run: |
          rm -f tools/build-1.3.66-builder-ui-cleanup.sh
          rm -f .github/workflows/build-1.3.66-builder-ui-cleanup.yml
          rm -f tools/inspect-1.3.65-builder-ui-css.sh
          rm -f tools/inspect-1.3.65-builder-ui-css-report.txt
          rm -f .github/workflows/inspect-1.3.65-builder-ui-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Forms 1.3.66 Builder UI cleanup" || exit 0
          git push
