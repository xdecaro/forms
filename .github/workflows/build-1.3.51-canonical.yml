name: Build Forms 1.3.51 Canonical

on:
  push:
    paths:
      - 'releases/_build1351/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Forms 1.3.51
        run: bash tools/build-1.3.51-canonical.sh
      - name: Commit canonical release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/1.3.51 updates/pkg_decaroforms.xml updates/changelog.xml
          git commit -m "Release Forms 1.3.51 canonical Builder core"
          git pull --rebase origin main
          git push
