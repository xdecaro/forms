name: Build Forms 1.3.69 Selection State
on:
  push:
    paths:
      - 'tools/build-1.3.69-selection-state.sh'
      - '.github/workflows/build-1.3.69-selection-state.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Forms 1.3.69
        run: bash tools/build-1.3.69-selection-state.sh
      - name: Commit release and cleanup helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/1.3.69 updates/pkg_decaroforms.xml updates/changelog.xml
          git rm -f tools/build-1.3.69-selection-state.sh .github/workflows/build-1.3.69-selection-state.yml
          git rm -f tools/inspect-1.3.68-selection-bug.sh .github/workflows/inspect-1.3.68-selection-bug.yml tools/inspect-1.3.68-selection-bug-report.txt || true
          git commit -m 'Release Forms 1.3.69 selection state fix'
          git push
