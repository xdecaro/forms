name: Inspect Forms 1.2.2 sources

on:
  push:
    paths:
      - 'tools/inspect-1.2.2/REQUEST'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print requested files
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/forms122inspect
          rm -rf "$ROOT"
          mkdir -p "$ROOT/outer" "$ROOT/component"
          unzip -q releases/1.2.2/pkg_decaroforms_1.2.2.zip -d "$ROOT/outer"
          unzip -q "$ROOT/outer/com_decaroforms_1.2.2.zip" -d "$ROOT/component"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "===== FILE: $f ====="
            cat "$ROOT/component/$f"
            echo
            echo "===== END FILE: $f ====="
          done < tools/inspect-1.2.2/REQUEST
