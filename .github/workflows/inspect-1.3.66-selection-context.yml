name: Inspect Forms 1.3.66 Selection Context
on:
  push:
    paths:
      - 'tools/inspect-1.3.66-selection-context.sh'
      - '.github/workflows/inspect-1.3.66-selection-context.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: bash tools/inspect-1.3.66-selection-context.sh
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/inspect-1.3.66-selection-context-report.txt
          git commit -m "Add Forms 1.3.66 selection context audit report" || exit 0
          git push
