name: Inspect Forms 1.3.65 Builder UI CSS
on:
  push:
    paths:
      - 'tools/inspect-1.3.65-builder-ui-css.sh'
      - '.github/workflows/inspect-1.3.65-builder-ui-css.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect Builder UI CSS
        run: bash tools/inspect-1.3.65-builder-ui-css.sh
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/inspect-1.3.65-builder-ui-css-report.txt
          git commit -m "Audit Forms 1.3.65 Builder UI CSS" || exit 0
          git push
