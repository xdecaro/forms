name: Inspect Forms 1.2.4 UI sources

on:
  push:
    paths:
      - 'tools/inspect-1.2.4-ui/REQUEST'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print requested component files
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/forms124inspect
          rm -rf "$ROOT"
          mkdir -p "$ROOT/outer" "$ROOT/component"
          unzip -q releases/1.2.4/pkg_decaroforms_1.2.4.zip -d "$ROOT/outer"
          unzip -q "$ROOT/outer/com_decaroforms_1.2.4.zip" -d "$ROOT/component"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "===== FILE: $f ====="
            if [ -f "$ROOT/component/$f" ]; then
              cat "$ROOT/component/$f"
            else
              echo MISSING
            fi
            echo "===== END FILE: $f ====="
          done < tools/inspect-1.2.4-ui/REQUEST
