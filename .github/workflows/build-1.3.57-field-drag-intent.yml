name: Build Forms 1.3.57 Field Drag Intent

on:
  push:
    paths:
      - 'tools/build-1.3.57-field-drag-intent.sh'
      - '.github/workflows/build-1.3.57-field-drag-intent.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Forms 1.3.57
        run: bash tools/build-1.3.57-field-drag-intent.sh

      - name: Commit release and cleanup helpers
        run: |
          rm -f tools/build-1.3.57-field-drag-intent.sh
          rm -f .github/workflows/build-1.3.57-field-drag-intent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Forms 1.3.57 intent-aware field drag" || exit 0
          git push
