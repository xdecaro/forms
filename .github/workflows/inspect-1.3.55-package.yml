name: Inspect Forms 1.3.55 Package

on:
  push:
    paths:
      - 'tools/inspect-1.3.55-package.sh'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect package
        run: bash tools/inspect-1.3.55-package.sh
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/inspect-1.3.55-package-report.txt
          git commit -m "Inspect Forms 1.3.55 package structure"
          git pull --rebase origin main
          git push
