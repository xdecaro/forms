name: Build Forms 1.3.55 Field Drag Zones

on:
  push:
    paths:
      - 'tools/build-1.3.55-field-drag-zones.sh'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Forms 1.3.55
        run: bash tools/build-1.3.55-field-drag-zones.sh
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/1.3.55 updates/pkg_decaroforms.xml updates/changelog.xml
          git commit -m "Release Forms 1.3.55 wider field drag zones"
          git pull --rebase origin main
          git push
