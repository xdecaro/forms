name: Inspect Forms 1.6 editor integration points

on:
  push:
    branches: [feature/editor-integration-1.7.0]
    paths:
      - '.github/workflows/inspect-1.6-editor-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual Forms 1.6.0 component payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/forms-package /tmp/forms-component
          mkdir -p /tmp/forms-package /tmp/forms-component
          unzip -q releases/1.6.0/pkg_decaroforms_1.6.0.zip -d /tmp/forms-package
          unzip -q /tmp/forms-package/com_decaroforms_1.6.0.zip -d /tmp/forms-component

          echo '=== TOP LEVEL ==='
          find /tmp/forms-component -maxdepth 4 -type f | sort | head -n 120

          BUILDER="$(find /tmp/forms-component -type f -path '*/tmpl/builder/default.php' -print -quit)"
          VIEW="$(find /tmp/forms-component -type f -path '*/src/View/Builder/HtmlView.php' -print -quit)"
          MANIFEST="$(find /tmp/forms-component -maxdepth 2 -type f -name '*.xml' -print -quit)"

          test -n "$BUILDER" && test -f "$BUILDER"
          echo "BUILDER=$BUILDER"
          echo "VIEW=${VIEW:-NOT FOUND}"
          echo "MANIFEST=${MANIFEST:-NOT FOUND}"

          echo '=== BUILDER HEAD ==='
          sed -n '1,120p' "$BUILDER"
          if [ -n "$VIEW" ]; then
            echo '=== BUILDER VIEW ==='
            sed -n '1,280p' "$VIEW"
          fi
          if [ -n "$MANIFEST" ]; then
            echo '=== MANIFEST ==='
            cat "$MANIFEST"
          fi

          python3 - "$BUILDER" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          markers = ['function renderEmailSpecial', "df-token-insert", "data-email-html", "data-chatgpt-html", "email_config_json", "useScript", "Editor"]
          for marker in markers:
              print(f'=== MARKER: {marker} ===')
              matches = [i for i, line in enumerate(text) if marker in line]
              if not matches:
                  print('NOT FOUND')
                  continue
              for i in matches[:3]:
                  start=max(0,i-10); end=min(len(text),i+28)
                  for n in range(start,end):
                      print(f'{n+1}: {text[n]}')
          PY

          echo '=== EDITOR / PLUGIN API REFERENCES ==='
          grep -RInE 'Joomla\\CMS\\Editor|Editor::|PluginHelper|editors|WebAsset|Joomla\.editors' /tmp/forms-component --include='*.php' --include='*.js' || true
