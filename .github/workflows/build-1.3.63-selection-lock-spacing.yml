name: Build Forms 1.3.63 Selection Lock Spacing
on:
  push:
    paths:
      - 'tools/build-1.3.63-selection-lock-spacing.sh'
      - '.github/workflows/build-1.3.63-selection-lock-spacing.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Forms 1.3.63
        run: bash tools/build-1.3.63-selection-lock-spacing.sh
      - name: Commit release and cleanup helpers
        run: |
          rm -f tools/build-1.3.63-selection-lock-spacing.sh
          rm -f .github/workflows/build-1.3.63-selection-lock-spacing.yml
          rm -f tools/inspect-1.3.62-selection-ui.sh
          rm -f tools/inspect-1.3.62-selection-ui-report.txt
          rm -f .github/workflows/inspect-1.3.62-selection-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Forms 1.3.63 selection lock spacing" || exit 0
          git push
