name: Inspect Forms 1.3.62 Selection UI
on:
  push:
    paths:
      - 'tools/inspect-1.3.62-selection-ui.sh'
      - '.github/workflows/inspect-1.3.62-selection-ui.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect selection UI
        run: bash tools/inspect-1.3.62-selection-ui.sh
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/inspect-1.3.62-selection-ui-report.txt
          git commit -m "Inspect Forms 1.3.62 selection UI" || exit 0
          git push
