name: Rebuild release package

on:
  push:
    paths:
      - 'releases/_upload/**'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild ZIP from Base64 chunks
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat releases/_upload/VERSION.txt)"
          EXPECTED="$(cat releases/_upload/SHA256.txt)"
          mkdir -p "releases/${VERSION}"
          cat releases/_upload/part-*.b64 | base64 -d > "releases/${VERSION}/pkg_decaroforms_${VERSION}.zip"
          ACTUAL="$(sha256sum "releases/${VERSION}/pkg_decaroforms_${VERSION}.zip" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf releases/_upload
      - name: Commit rebuilt package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases
          git commit -m "Publish Forms $(cat /dev/null 2>/dev/null || true) release package" || exit 0
          git push
