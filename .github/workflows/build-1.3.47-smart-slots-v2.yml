name: Build Forms 1.3.47 smart slots v2

on:
  push:
    paths:
      - 'releases/_build1347v2/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Forms 1.3.47
        run: bash tools/build-1.3.47-smart-slots-v2.sh
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf releases/_build1347v2 releases/_build1347
          git add -A
          git commit -m "Build Forms 1.3.47 smart slots" || exit 0
          git push
