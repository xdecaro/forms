name: Inspect Forms 1.6 editor integration points

on:
  push:
    branches: [feature/editor-integration-1.7.0]
    paths:
      - '.github/workflows/inspect-1.6-editor-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual Forms 1.6.0 component payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/forms-package /tmp/forms-component
          unzip -q releases/1.6.0/pkg_decaroforms_1.6.0.zip -d /tmp/forms-package
          unzip -q /tmp/forms-package/com_decaroforms_1.6.0.zip -d /tmp/forms-component

          BUILDER=/tmp/forms-component/administrator/components/com_decaroforms/tmpl/builder/default.php
          VIEW=/tmp/forms-component/administrator/components/com_decaroforms/src/View/Builder/HtmlView.php
          MANIFEST=/tmp/forms-component/administrator/components/com_decaroforms/decaroforms.xml

          test -f "$BUILDER"
          test -f "$VIEW"
          test -f "$MANIFEST"

          echo '=== BUILDER HEAD ==='
          sed -n '1,120p' "$BUILDER"
          echo '=== BUILDER VIEW ==='
          sed -n '1,240p' "$VIEW"
          echo '=== MANIFEST ==='
          cat "$MANIFEST"

          python3 - "$BUILDER" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          markers = ['function renderEmailSpecial', "df-token-insert", "data-email-html", "data-chatgpt-html", "email_config_json"]
          for marker in markers:
              print(f'=== MARKER: {marker} ===')
              matches = [i for i, line in enumerate(text) if marker in line]
              if not matches:
                  print('NOT FOUND')
                  continue
              for i in matches[:3]:
                  start=max(0,i-8); end=min(len(text),i+22)
                  for n in range(start,end):
                      print(f'{n+1}: {text[n]}')
          PY

          echo '=== EDITOR / PLUGIN API REFERENCES ==='
          grep -RInE 'Joomla\\CMS\\Editor|Editor::|PluginHelper|editors|WebAsset|Joomla\.editors' /tmp/forms-component/administrator/components/com_decaroforms --include='*.php' --include='*.js' || true
