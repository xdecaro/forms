name: Verify Forms 1.3.55 Package

on:
  push:
    paths:
      - 'tools/verify-1.3.55-package.sh'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package
        run: bash tools/verify-1.3.55-package.sh
      - name: Commit verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/verify-1.3.55-package-report.txt
          git commit -m "Verify Forms 1.3.55 installable package"
          git pull --rebase origin main
          git push
