name: Build Forms 1.3.74 integration parity

on:
  push:
    branches: [main]
    paths:
      - "tools/build-1.3.74-integration-parity.sh"
      - ".github/workflows/build-1.3.74-integration-parity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate Forms 1.3.74
        shell: bash
        run: bash tools/build-1.3.74-integration-parity.sh

      - name: Commit generated release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/1.3.74 updates/pkg_decaroforms.xml updates/changelog.xml
          if git diff --cached --quiet; then
            echo "Forms 1.3.74 already generated."
            exit 0
          fi
          git commit -m "Publish Forms 1.3.74"
          git push
