name: Clean Forms Information temporary files

on:
  push:
    paths:
      - '.github/workflows/cleanup-forms-info-temp.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary inspection and failure files
        shell: bash
        run: |
          rm -f .github/workflows/inspect-1.3.69-information.yml
          rm -f tools/inspect-1.3.69-information.sh
          rm -rf tools/_inspect-1.3.69-information
          rm -f releases/_inspect-1.3.69-information.txt
          rm -f tools/_build-1.3.70-information-failure.log
          rm -f .github/workflows/cleanup-forms-info-temp.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean Forms Information temporary inspection files" || exit 0
          git push
