name: Build Forms 1.3.44 structure UX

on:
  push:
    paths:
      - 'releases/_build1344/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Forms 1.3.44
        run: bash tools/build-1.3.44-structure-ux.sh
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf releases/_build1344
          git add -A
          git commit -m "Publish Forms 1.3.44 structure UX" || exit 0
          git push
