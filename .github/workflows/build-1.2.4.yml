name: Build Forms 1.2.4

on:
  push:
    paths:
      - 'tools/build-1.2.4/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate Joomla package
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/forms124
          rm -rf "$ROOT"
          mkdir -p "$ROOT/outer" "$ROOT/component" "$ROOT/plugin"

          unzip -q releases/1.2.3/pkg_decaroforms_1.2.3.zip -d "$ROOT/outer"
          unzip -q "$ROOT/outer/com_decaroforms_1.2.3.zip" -d "$ROOT/component"
          unzip -q "$ROOT/outer/plg_system_decaroforms_1.2.3.zip" -d "$ROOT/plugin"

          python3 patches/1.2.4/apply_patch.py "$ROOT/component" "$ROOT/plugin" "$ROOT/outer"

          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find "$ROOT/component" "$ROOT/plugin" -type f -name '*.php' -print0)

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for f in [
              Path('/tmp/forms124/component/com_decaroforms.xml'),
              Path('/tmp/forms124/plugin/decaroforms.xml'),
              Path('/tmp/forms124/outer/pkg_decaroforms.xml'),
          ]:
              ET.parse(f)
              print('OK', f)
          PY

          DETAIL="$ROOT/component/administrator/components/com_decaroforms/tmpl/submission/default.php"
          grep -Fq "array_map(fn(\$st)=>" "$DETAIL"
          if grep -Fq "array_map(static fn(\$st)=>" "$DETAIL"; then
            echo 'ERROR: old static arrow function is still present'
            exit 1
          fi
          grep -Fq "VERSION = '1.2.4'" "$ROOT/component/administrator/components/com_decaroforms/src/Helper/FormHelper.php"

          rm -f "$ROOT/outer/com_decaroforms_1.2.3.zip" "$ROOT/outer/plg_system_decaroforms_1.2.3.zip"
          (cd "$ROOT/component" && zip -qr "$ROOT/outer/com_decaroforms_1.2.4.zip" .)
          (cd "$ROOT/plugin" && zip -qr "$ROOT/outer/plg_system_decaroforms_1.2.4.zip" .)

          mkdir -p releases/1.2.4
          rm -f releases/1.2.4/pkg_decaroforms_1.2.4.zip
          (cd "$ROOT/outer" && zip -qr "$GITHUB_WORKSPACE/releases/1.2.4/pkg_decaroforms_1.2.4.zip" .)

          unzip -t releases/1.2.4/pkg_decaroforms_1.2.4.zip >/dev/null
          SHA=$(sha256sum releases/1.2.4/pkg_decaroforms_1.2.4.zip | awk '{print $1}')
          echo "PACKAGE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Built SHA-256: $SHA"

      - name: Update release metadata and feed
        shell: bash
        run: |
          set -euo pipefail
          cat > releases/1.2.4/README.md <<EOF
          # Forms 1.2.4

          Hotfix release for the administrator single-submission detail view.

          ## Fixed

          - fixes **Using \$this when not in object context** when clicking **Apri** on a submission;
          - the status badge preview in **Gestisci invio** now builds correctly;
          - no form, submission or database data is changed.

          Official package SHA-256:

          \`${PACKAGE_SHA}\`
          EOF

          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          sha=os.environ['PACKAGE_SHA']
          Path('updates/pkg_decaroforms.xml').write_text(f'''<?xml version="1.0" encoding="utf-8"?>
          <updates>
              <update>
                  <name>Forms</name>
                  <description>Reusable Joomla form builder, submissions manager, data importer and export tools.</description>
                  <element>pkg_decaroforms</element>
                  <type>package</type>
                  <client>site</client>
                  <version>1.2.4</version>
                  <downloads>
                      <downloadurl type="full" format="zip">https://raw.githubusercontent.com/xdecaro/forms/main/releases/1.2.4/pkg_decaroforms_1.2.4.zip</downloadurl>
                  </downloads>
                  <changelogurl>https://raw.githubusercontent.com/xdecaro/forms/main/updates/changelog.xml</changelogurl>
                  <tags><tag>stable</tag></tags>
                  <maintainer>Luca De Caro</maintainer>
                  <maintainerurl>https://github.com/xdecaro/forms</maintainerurl>
                  <targetplatform name="joomla" version="6\\.[0-9]+" />
                  <php_minimum>8.3.0</php_minimum>
                  <sha256>{sha}</sha256>
              </update>
          </updates>
          ''',encoding='utf-8')

          p=Path('updates/changelog.xml')
          t=p.read_text(encoding='utf-8')
          if '<version>1.2.4</version>' not in t:
              entry='''  <changelog>
              <element>pkg_decaroforms</element>
              <type>package</type>
              <version>1.2.4</version>
              <fix>
                <item>Fixed PHP runtime error when opening a single submission from the administrator list.</item>
                <item>Fixed status preview generation in the single-submission management panel.</item>
              </fix>
            </changelog>
          '''
              t=t.replace('<changelogs>\n','<changelogs>\n'+entry,1)
              p.write_text(t,encoding='utf-8')

          ET.parse('updates/pkg_decaroforms.xml')
          ET.parse('updates/changelog.xml')
          PY

      - name: Clean temporary helpers and publish 1.2.4
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/build-1.2.4 patches/1.2.4
          rm -f .github/workflows/build-1.2.4.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Forms 1.2.4'
          git push origin HEAD:main
