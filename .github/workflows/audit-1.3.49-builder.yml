name: Audit Forms 1.3.49 Builder

on:
  push:
    paths:
      - 'releases/_audit1349/READY'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full Builder audit
        run: bash tools/audit-1.3.49-builder.sh
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf releases/_audit1349
          git add tools/audit-1.3.49-builder-report.txt
          git add -u releases/_audit1349 || true
          git commit -m "Audit Forms 1.3.49 Builder" || exit 0
          git push
