name: Build Forms 1.3.68 Builder Actions
on:
  push:
    paths:
      - 'tools/build-1.3.68-builder-actions.sh'
      - '.github/workflows/build-1.3.68-builder-actions.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Forms 1.3.68
        run: bash tools/build-1.3.68-builder-actions.sh
      - name: Commit release and cleanup helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f \
            tools/build-1.3.68-builder-actions.sh \
            .github/workflows/build-1.3.68-builder-actions.yml \
            tools/inspect-1.3.67-add-actions.sh \
            tools/inspect-1.3.67-add-actions-report.txt \
            .github/workflows/inspect-1.3.67-add-actions.yml
          git add -A releases/1.3.68 updates tools .github/workflows
          git diff --cached --quiet || git commit -m 'Release Forms 1.3.68 Builder structure actions'
          git push
