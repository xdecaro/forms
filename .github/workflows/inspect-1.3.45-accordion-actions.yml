name: Inspect Forms 1.3.45 accordion actions

on:
  push:
    paths:
      - 'releases/_inspect1345/READY'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Forms 1.3.45
        run: bash tools/inspect-1.3.45-accordion-actions.sh
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf releases/_inspect1345
          git add -A
          git commit -m "Inspect Forms 1.3.45 accordion actions" || exit 0
          git push
