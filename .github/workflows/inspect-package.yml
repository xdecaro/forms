name: Inspect Forms package

on:
  push:
    paths:
      - 'tools/inspect/READY'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect package structure and relevant sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/forms-inspect
          mkdir -p /tmp/forms-inspect/outer /tmp/forms-inspect/nested
          unzip -q releases/1.2.1/pkg_decaroforms_1.2.1.zip -d /tmp/forms-inspect/outer
          echo '=== OUTER FILES ==='
          find /tmp/forms-inspect/outer -maxdepth 3 -type f -printf '%P\n' | sort
          echo '=== NESTED ZIP CONTENTS ==='
          i=0
          while IFS= read -r z; do
            i=$((i+1))
            d="/tmp/forms-inspect/nested/$i"
            mkdir -p "$d"
            echo "--- ZIP: $(basename "$z") ---"
            unzip -q "$z" -d "$d"
            find "$d" -type f -printf '%P\n' | sort
          done < <(find /tmp/forms-inspect/outer -type f -name '*.zip' | sort)
          echo '=== RELEVANT MATCHES ==='
          grep -RniE --include='*.php' --include='*.xml' --include='*.js' --include='*.css' --include='*.html' --include='*.ini' 'Invii recenti|Template email|Dashboard|submissions|Esporta|CSV|Excel|PDF|Informazioni|Importazione dati|Apri invii|Crea modulo' /tmp/forms-inspect/nested | head -n 500 || true
