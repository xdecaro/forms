name: Audit Forms 1.3.49 Builder Server

on:
  push:
    paths:
      - 'releases/_audit1349server/READY'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Builder server
        run: bash tools/audit-1.3.49-builder-server.sh
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf releases/_audit1349server
          git add tools/audit-1.3.49-builder-server-report.txt
          git add -u releases/_audit1349server || true
          git commit -m "Audit Forms 1.3.49 Builder server" || exit 0
          git push
