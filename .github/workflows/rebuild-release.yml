name: Rebuild release package

on:
  push:
    paths:
      - 'releases/_upload/READY'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forms release operation
        shell: bash
        run: |
          set -euo pipefail
          MODE="$(cat releases/_upload/MODE.txt 2>/dev/null || true)"
          if [ "$MODE" = "inspect-update-link" ]; then
            bash tools/inspect-update-link.sh
            exit 0
          fi
          if [ "$MODE" = "inspect-builder-1.3.25-ai" ]; then
            bash tools/inspect-builder-1.3.25-ai.sh
            exit 0
          fi
          if [ "$MODE" = "inspect-builder-1.3.26-ai" ]; then
            bash tools/inspect-builder-1.3.26-ai.sh
            exit 0
          fi
          if [ "$MODE" = "inspect-builder-1.3.27-ai" ]; then
            bash tools/inspect-builder-1.3.27-ai.sh
            exit 0
          fi
          if [ "$MODE" = "inspect-1.3.32-structure" ]; then
            bash tools/inspect-1.3.32-structure.sh
            exit 0
          fi
          if [ "$MODE" = "inspect-1.3.33-ux" ]; then
            bash tools/inspect-1.3.33-ux.sh
            exit 0
          fi
          if [ "$MODE" = "inspect-1.3.34-drag" ]; then
            bash tools/inspect-1.3.34-drag.sh
            exit 0
          fi
          if [ "$MODE" = "inspect-1.3.35-structure-dnd" ]; then
            bash tools/inspect-1.3.35-structure-dnd.sh
            exit 0
          fi
          if [ "$MODE" = "inspect-1.3.36-all" ]; then
            bash tools/inspect-1.3.36-all.sh
            exit 0
          fi
          if [ "$MODE" = "inspect-1.3.37-row-icons" ]; then
            bash tools/inspect-1.3.37-row-icons.sh
            exit 0
          fi
          if [ "$MODE" = "inspect-1.3.38-smart-add-filters" ]; then
            bash tools/inspect-1.3.38-smart-add-filters.sh
            exit 0
          fi
          if [ "$MODE" = "inspect-1.3.39-dnd" ]; then
            bash tools/inspect-1.3.39-dnd.sh
            exit 0
          fi
          if [ "$MODE" = "debug-build-1.3.27-ai-import" ]; then
            set +e
            bash -x tools/run-build-1.3.27-ai-import.sh > tools/build-1.3.27-ai-debug.log 2>&1
            STATUS=$?
            set -e
            printf '\nEXIT_STATUS=%s\n' "$STATUS" >> tools/build-1.3.27-ai-debug.log
            rm -rf releases/_upload
            exit 0
          fi
          if [ "$MODE" = "build-1.3.27-ai-import" ]; then
            bash tools/run-build-1.3.27-ai-import.sh
            exit 0
          fi
          if [ "$MODE" = "build-1.3.28-ai-modal-fix" ]; then
            bash tools/build-1.3.28-ai-modal-fix.sh
            exit 0
          fi
          if [ "$MODE" = "build-1.3.29-ai-file-flow" ]; then
            bash tools/build-1.3.29-ai-file-flow.sh
            exit 0
          fi
          if [ "$MODE" = "build-1.3.30-html-import" ]; then
            bash tools/run-build-1.3.30-html-import.sh
            exit 0
          fi
          if [ "$MODE" = "build-1.3.31-ai-ui-cleanup" ]; then
            bash tools/build-1.3.31-ai-ui-cleanup.sh
            exit 0
          fi
          if [ "$MODE" = "build-1.3.32-ai-mode-tabs-zip" ]; then
            bash tools/build-1.3.32-ai-mode-tabs-zip.sh
            exit 0
          fi
          if [ "$MODE" = "build-1.3.33-structure-accordions" ]; then
            bash tools/build-1.3.33-structure-accordions.sh
            exit 0
          fi
          if [ "$MODE" = "build-1.3.34-ai-upload-structure-settings" ]; then
            bash tools/build-1.3.34-ai-upload-structure-settings-fixed.sh
            exit 0
          fi
          if [ "$MODE" = "build-1.3.35-smart-drag" ]; then
            bash tools/build-1.3.35-smart-drag.sh
            exit 0
          fi
          if [ "$MODE" = "build-1.3.36-structure-drag" ]; then
            bash tools/build-1.3.36-structure-drag.sh
            exit 0
          fi
          if [ "$MODE" = "build-1.3.37-html-sections-translations" ]; then
            bash tools/build-1.3.37-html-sections-translations-fixed.sh
            exit 0
          fi
          if [ "$MODE" = "build-1.3.38-row-grouping-modern-icons" ]; then
            bash tools/build-1.3.38-row-grouping-modern-icons.sh
            exit 0
          fi
          if [ "$MODE" = "build-1.3.39-smart-add-preview-filters" ]; then
            bash tools/build-1.3.39-smart-add-preview-filters-fixed.sh
            exit 0
          fi
          if [ "$MODE" = "build-1.3.40-row-actions-dropzones" ]; then
            bash tools/build-1.3.40-row-actions-dropzones.sh
            exit 0
          fi
          VERSION="$(cat releases/_upload/VERSION.txt)"
          EXPECTED="$(cat releases/_upload/SHA256.txt)"
          TARGET="releases/${VERSION}/pkg_decaroforms_${VERSION}.zip"
          mkdir -p "releases/${VERSION}"
          cat releases/_upload/part-000.b64 releases/_upload/part-001.b64 releases/_upload/part-002.b64 releases/_upload/part-003.b64 releases/_upload/part-004.b64 releases/_upload/part-005.b64 releases/_upload/part-006.b64 releases/_upload/part-007.b64 releases/_upload/part-008.b64 | base64 -d | xz -d > "$TARGET"
          ACTUAL="$(sha256sum "$TARGET" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf releases/_upload
      - name: Commit rebuilt package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Forms release package" || exit 0
          git push
